<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Persian rendering fix, system wide.

    Problem: every generic family resolved to DejaVu Sans for Persian.
    DejaVu ships Arabic glyphs, and because the glyphs exist no toolkit ever
    falls through to a better face, so Persian looked wrong in the VSCode
    editor, its UI, its webview panels and its terminal all at once.

    Fix: head every generic family with a Latin face that has NO Arabic
    glyphs (Noto Sans / Noto Serif / Noto Sans Mono), then "Vazirmatn NL".
    English renders in Noto, Persian falls through to Vazirmatn, and
    DejaVu's Arabic is never reached.

    Vazirmatn NL must not go first: it has no Latin letters but does carry
    space and ( ) + - . / : = [ ], so Chromium (VSCode, browsers) mixed its
    punctuation with a per character Latin fallback that ignores the generic
    family, and English came out in a random, often serif, face.

    Stripping the Arabic block out of DejaVu with a target="scan" charset
    minus would be the tidier fix, but that is a no-op on fontconfig 2.13.1,
    which is the version here.

    To undo: rm this file and run `fc-cache -f`.
  -->

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Vazirmatn NL</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Vazirmatn NL</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Vazirmatn NL</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Vazirmatn NL</family>
    </prefer>
  </alias>

  <!-- Explicitly requested families still get Vazirmatn for Persian text -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Vazirmatn NL</string>
    </edit>
  </match>

</fontconfig>
