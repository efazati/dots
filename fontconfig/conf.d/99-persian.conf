<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Persian rendering fix, system wide.

    Problem: every generic family resolved to DejaVu Sans for Persian.
    DejaVu ships Arabic glyphs, and because the glyphs exist no toolkit ever
    falls through to a better face, so Persian looked wrong in the VSCode
    editor, its UI, its webview panels and its terminal all at once.

    Fix: put "Vazirmatn NL" at the head of every generic family. That face is
    the Non-Latin cut of Vazirmatn: it carries Persian and Arabic and nothing
    else, no Latin letters, digits, punctuation or symbols. Per character
    fallback therefore takes Persian from Vazirmatn NL and everything else
    from the font in second place, which stays DejaVu Sans for the
    proportional families and DejaVu Sans Mono for monospace.

    Stripping the Arabic block out of DejaVu with a target="scan" charset
    minus would be the tidier fix, but that is a no-op on fontconfig 2.13.1,
    which is the version here.

    To undo: rm this file and run `fc-cache -f`.
  -->

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Vazirmatn NL</family></prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Vazirmatn NL</family></prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Vazirmatn NL</family></prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Vazirmatn NL</family></prefer>
  </alias>

  <!-- Explicitly requested families still get Vazirmatn for Persian text -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Vazirmatn NL</string>
    </edit>
  </match>

</fontconfig>
