# Warp custom keybindings (~/.config/warp-terminal/keybindings.yaml)
# Action ids verified against the Warp binary. Keys quoted (colons in keys).
"terminal:copy": "ctrl-c"
"terminal:paste": "ctrl-v"
"pane_group:navigate_prev": "ctrl-shift-left"
"pane_group:navigate_next": "ctrl-shift-right"
"pane_group:close_current_session": "ctrl-w"
